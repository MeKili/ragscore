[project]
name = "ragscore"
version = "0.1.0"
description = "Evaluation toolkit for retrieval and RAG systems: ranking and answer metrics, a from-scratch BM25 baseline, and paired bootstrap significance testing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kilian Minkwitz" }]
dependencies = []

[project.scripts]
ragscore = "ragscore.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragscore"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
